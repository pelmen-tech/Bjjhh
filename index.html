<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ULTRA-OVERDRIVE: CYBERPUNK CITY</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #05050a; color: #fff;
            position: fixed;
        }

        #game-container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 1;
        }

        #game-container canvas {
            width: 100% !important; height: 100% !important; display: block;
        }

        #rotate-warning {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #05050a; z-index: 1000;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: #00ffcc; font-size: 18px; padding: 20px;
        }

        @media screen and (orientation: portrait) {
            #rotate-warning { display: flex; }
        }

        /* HUD Overlay */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            border: 2px solid #00ffcc; border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ffcc;
        }

        #stats-bar {
            position: absolute; top: 15px; left: 20px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .bar-container {
            width: 180px; height: 12px; background: rgba(255,0,0,0.2);
            border: 1px solid #ff0055;
        }

        #hp-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.1s; }

        #weapon-display {
            font-size: 16px; font-weight: bold; color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc;
        }

        #style-hud {
            position: absolute; top: 15px; right: 20px; text-align: right;
        }

        #style-rank {
            font-size: 44px; font-weight: 900; color: #ffcc00;
            text-shadow: 0 0 15px #ffcc00; line-height: 1;
        }

        #style-score { font-size: 16px; color: #00ffcc; margin-top: 2px; }

        #style-feed {
            display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-top: 5px;
        }

        .feed-item {
            font-size: 12px; font-weight: bold; color: #ff0055;
            animation: fade 1.5s forwards;
        }

        @keyframes fade { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(20px); } }

        /* Weapon Selector Sidebar */
        #weapon-selector {
            position: absolute; top: 50%; right: 15px;
            transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: auto; z-index: 15;
        }

        .wpn-btn {
            width: 85px; height: 32px; background: rgba(5, 5, 15, 0.85);
            border: 1px solid #00ffcc; color: #00ffcc;
            font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; cursor: pointer;
        }

        .wpn-btn.active {
            background: #00ffcc; color: #000;
            box-shadow: 0 0 10px #00ffcc;
        }

        /* Touch Controls */
        .touch-zone { position: absolute; pointer-events: auto; }

        #joystick-zone {
            bottom: 20px; left: 30px; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(0, 255, 204, 0.4);
            border-radius: 50%;
        }

        #joystick-knob {
            position: absolute; top: 32px; left: 32px; width: 45px; height: 45px;
            background: #00ffcc; border-radius: 50%; opacity: 0.7;
        }

        #buttons-zone {
            bottom: 15px; right: 110px; display: grid;
            grid-template-columns: repeat(3, 50px); grid-gap: 8px;
        }

        .touch-btn {
            width: 50px; height: 50px; background: rgba(0, 0, 0, 0.75);
            border: 2px solid #00ffcc; color: #00ffcc; border-radius: 50%;
            font-size: 9px; font-weight: bold; display: flex;
            justify-content: center; align-items: center;
        }

        .touch-btn:active { background: #00ffcc; color: #000; }
        #btn-fire { grid-column: 3; grid-row: 2; width: 60px; height: 60px; border-color: #ff0055; color: #ff0055; }

        /* Menus */
        #menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,10,0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px;
        }

        .title { font-size: 28px; color: #00ffcc; text-shadow: 2px 2px #ff0055; letter-spacing: 2px; text-align: center; }
        .btn { padding: 12px 30px; background: transparent; border: 2px solid #00ffcc; color: #00ffcc; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:active { background: #00ffcc; color: #000; }
        .hidden { display: none !important; }
        #flash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.05s; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="rotate-warning">
        <div style="font-size: 40px; margin-bottom: 10px;">🔄</div>
        ПОЖАЛУЙСТА, ПОВЕРНИТЕ УСТРОЙСТВО ГОРИЗОНТАЛЬНО
    </div>

    <div id="game-container"></div>
    <div id="flash-screen"></div>

    <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="stats-bar">
            <div id="weapon-display">1. REVOLVER</div>
            <div class="bar-container"><div id="hp-fill"></div></div>
            <div style="font-size: 11px; color:#aaa;">HEALTH: <span id="hp-val">100</span></div>
        </div>

        <!-- Боковая панель выбора оружия -->
        <div id="weapon-selector">
            <div class="wpn-btn active" data-idx="0">1. REV</div>
            <div class="wpn-btn" data-idx="1">2. SHOTGUN</div>
            <div class="wpn-btn" data-idx="2">3. JACK</div>
            <div class="wpn-btn" data-idx="3">4. NAIL</div>
            <div class="wpn-btn" data-idx="4">5. RAIL</div>
            <div class="wpn-btn" data-idx="5">6. ROCKET</div>
        </div>

        <div id="style-hud">
            <div id="style-rank">D</div>
            <div id="style-score">0 PTS</div>
            <div id="style-feed"></div>
        </div>

        <div id="joystick-zone" class="touch-zone"><div id="joystick-knob"></div></div>
        <div id="buttons-zone" class="touch-zone">
            <div id="btn-jump" class="touch-btn">JUMP</div>
            <div id="btn-dash" class="touch-btn">DASH</div>
            <div id="btn-alt" class="touch-btn">ALT</div>
            <div id="btn-parry" class="touch-btn">PARRY</div>
            <div id="btn-fire" class="touch-btn">FIRE</div>
        </div>
    </div>

    <div id="menu-overlay">
        <h1 class="title">ULTRA-OVERDRIVE<br><span style="color:#ff0055; font-size:16px;">CYBERPUNK CITY</span></h1>
        <button id="btn-start" class="btn">ENTER CITY</button>
    </div>

    <script>
        let scene, camera, renderer;
        let audioCtx = null;
        let player = { hp: 100, maxHp: 100, pos: new THREE.Vector3(0, 2, 0), vel: new THREE.Vector3(), pitch: 0, yaw: 0, isGrounded: true, ridingRocket: null };
        let weapons = [
            { name: "1. REVOLVER", type: "revolver", cooldown: 0.2, last: 0 },
            { name: "2. SHOTGUN", type: "shotgun", cooldown: 0.6, last: 0 },
            { name: "3. JACKHAMMER", type: "jackhammer", cooldown: 0.7, last: 0 },
            { name: "4. NAILGUN", type: "nailgun", cooldown: 0.08, last: 0 },
            { name: "5. RAILCANNON", type: "rail", cooldown: 1.2, last: 0 },
            { name: "6. ROCKET LAUNCHER", type: "rocket", cooldown: 0.8, last: 0 }
        ];
        let currentWpnIdx = 0;
        let enemies = [], projectiles = [], coins = [], cores = [], rockets = [], particles = [];
        let rocketsFrozen = false;
        let score = 0, combo = 1;
        let isPlaying = false, isPaused = false;
        let touchLook = { id: null, x: 0, y: 0 }, moveVec = { x: 0, y: 0 };

        function playSfx(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);

                if (type === 'shoot') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'shotgun') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.25);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'jackhammer') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now);
                    osc.frequency.linearRampToValueAtTime(10, now + 0.35);
                    gain.gain.setValueAtTime(0.7, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now); osc.stop(now + 0.35);
                } else if (type === 'rail') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'coin') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(1800, now);
                    osc.frequency.setValueAtTime(2400, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'parry') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.2);
                    gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'explosion') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
                    osc.frequency.exponentialRampToValueAtTime(10, now + 0.6);
                    gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6);
                }
            } catch(e){}
        }

        function initEngine() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 500);
            
            renderer = new THREE.WebGLRenderer({ antialias: false, precision: "mediump" });
            renderer.setPixelRatio(1);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            player.pos.set(0, 2, 0);
            camera.position.copy(player.pos);

            buildCyberpunkCity();
            setupEvents();
            spawnWave();

            const resize = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };

            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', () => setTimeout(resize, 200));
        }

        function selectWeapon(idx) {
            currentWpnIdx = idx;
            document.getElementById('weapon-display').innerText = weapons[currentWpnIdx].name;
            document.querySelectorAll('.wpn-btn').forEach((btn, i) => {
                if (i === idx) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function buildCyberpunkCity() {
            const roadGeo = new THREE.PlaneGeometry(160, 160);
            const roadMat = new THREE.MeshBasicMaterial({ color: 0x0a0a14 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            const gridGeo = new THREE.PlaneGeometry(160, 160, 32, 32);
            const gridMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
            const grid = new THREE.Mesh(gridGeo, gridMat);
            grid.rotation.x = -Math.PI / 2;
            grid.position.y = 0.02;
            scene.add(grid);

            const buildingColors = [0x00ffcc, 0xff0055, 0xaa00ff, 0x0099ff];
            
            for (let i = 0; i < 24; i++) {
                const angle = (i / 24) * Math.PI * 2;
                const dist = 38 + Math.random() * 25;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                
                const width = 8 + Math.random() * 8;
                const height = 25 + Math.random() * 45;
                const depth = 8 + Math.random() * 8;
                const color = buildingColors[i % buildingColors.length];

                const bGroup = new THREE.Group();
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(width, height, depth),
                    new THREE.MeshBasicMaterial({ color: 0x030308 })
                );
                body.position.y = height / 2;
                bGroup.add(body);

                const frame = new THREE.Mesh(
                    new THREE.BoxGeometry(width + 0.2, height + 0.2, depth + 0.2),
                    new THREE.MeshBasicMaterial({ color: color, wireframe: true })
                );
                frame.position.y = height / 2;
                bGroup.add(frame);

                bGroup.position.set(x, 0, z);
                scene.add(bGroup);
            }
        }

        class Enemy {
            constructor(type, pos) {
                this.type = type;
                this.hp = type === 'cerberus' ? 250 : (type === 'stray' ? 80 : 45);
                this.maxHp = this.hp;
                this.speed = type === 'filth' ? 10 : (type === 'stray' ? 5.5 : 7.5);
                this.attackTimer = 0;

                this.mesh = new THREE.Group();
                let matColor = type === 'cerberus' ? 0x00ffff : (type === 'stray' ? 0xffcc00 : 0xff0055);
                const mat = new THREE.MeshBasicMaterial({ color: matColor, wireframe: true });

                if (type === 'cerberus') {
                    const body = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 3), mat);
                    body.position.y = 2;
                    this.mesh.add(body);
                    const head = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true }));
                    head.position.y = 4.5;
                    this.mesh.add(head);
                } else if (type === 'stray') {
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 3, 8), mat);
                    body.position.y = 1.5;
                    this.mesh.add(body);
                    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true }));
                    head.position.y = 3.2;
                    this.mesh.add(head);
                } else {
                    const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.2, 1.4), mat);
                    body.position.y = 1.1;
                    this.mesh.add(body);
                }

                this.mesh.position.copy(pos);
                scene.add(this.mesh);
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                createParticles(this.mesh.position, 0xff0055, 6);
                if (this.hp <= 0) {
                    addStyle(120, "KILL");
                    createExplosion(this.mesh.position, 2.5, 0xff0055);
                    scene.remove(this.mesh);
                    enemies = enemies.filter(e => e !== this);
                }
            }

            update(dt) {
                const dir = new THREE.Vector3().subVectors(player.pos, this.mesh.position);
                dir.y = 0;
                const dist = dir.length();
                dir.normalize();

                if (dist > 1.8) {
                    this.mesh.position.addScaledVector(dir, this.speed * dt);
                }

                this.mesh.lookAt(player.pos.x, this.mesh.position.y, player.pos.z);

                if (this.type === 'stray' && dist < 28) {
                    this.attackTimer += dt;
                    if (this.attackTimer > 2.2) {
                        this.attackTimer = 0;
                        spawnFireball(this.mesh.position.clone().add(new THREE.Vector3(0, 2.5, 0)), dir);
                    }
                } else if (this.type === 'filth' && dist < 2.2) {
                    this.attackTimer += dt;
                    if (this.attackTimer > 0.8) {
                        this.attackTimer = 0;
                        damagePlayer(15);
                    }
                } else if (this.type === 'cerberus' && dist < 3.2) {
                    this.attackTimer += dt;
                    if (this.attackTimer > 1.2) {
                        this.attackTimer = 0;
                        damagePlayer(30);
                    }
                }
            }
        }

        function spawnFireball(pos, dir) {
            const geo = new THREE.SphereGeometry(0.5, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            scene.add(mesh);
            projectiles.push({ mesh, dir: dir.clone().multiplyScalar(12) });
        }

        function firePrimary() {
            if (!isPlaying) return;
            const w = weapons[currentWpnIdx];
            const now = performance.now() / 1000;
            if (now - w.last < w.cooldown) return;
            w.last = now;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            if (w.type === 'revolver') {
                playSfx('shoot');
                checkHitscan(raycaster, 35, "REVOLVER");
            } else if (w.type === 'shotgun') {
                playSfx('shotgun');
                for (let i = 0; i < 6; i++) {
                    const spread = new THREE.Vector2((Math.random() - 0.5) * 0.12, (Math.random() - 0.5) * 0.12);
                    raycaster.setFromCamera(spread, camera);
                    checkHitscan(raycaster, 18, "SHOTGUN");
                }
            } else if (w.type === 'jackhammer') {
                playSfx('jackhammer');
                const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
                
                // Отдача/Импульс от отталкивания
                const lookDir = new THREE.Vector3();
                camera.getWorldDirection(lookDir);
                player.vel.addScaledVector(lookDir, -25);
                if (player.vel.y < 5) player.vel.y = 8;
                player.isGrounded = false;

                if (hits.length > 0 && hits[0].distance < 5.0) {
                    const enemy = getEnemyFromMesh(hits[0].object);
                    if (enemy) {
                        enemy.takeDamage(200);
                        addStyle(180, "JACKHAMMER IMPACT");
                        flashScreen(0xffcc00);
                    }
                }
            } else if (w.type === 'nailgun') {
                playSfx('shoot');
                checkHitscan(raycaster, 12, "NAILGUN");
            } else if (w.type === 'rail') {
                playSfx('rail');
                flashScreen(0x00ffcc);
                
                // Проверка CORE NUKE (Большой сферический хитбокс для ядра)
                let coreHit = false;
                cores.forEach((c, idx) => {
                    const distToRay = raycaster.ray.distanceToPoint(c.mesh.position);
                    if (distToRay < 2.5 && !coreHit) {
                        coreHit = true;
                        const nukePos = c.mesh.position.clone();
                        scene.remove(c.mesh);
                        cores.splice(idx, 1);
                        triggerCoreNuke(nukePos);
                    }
                });

                if (!coreHit) {
                    checkHitscan(raycaster, 220, "RAILCANNON");
                }
            } else if (w.type === 'rocket') {
                playSfx('shoot');
                const geo = new THREE.CylinderGeometry(0.2, 0.2, 1, 8);
                geo.rotateX(Math.PI / 2);
                const mat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
                const mesh = new THREE.Mesh(geo, mat);

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                mesh.position.copy(camera.position).add(dir.clone().multiplyScalar(1.5));
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), dir);

                scene.add(mesh);
                rockets.push({ mesh, dir: dir.multiplyScalar(22), frozen: rocketsFrozen });
            }
        }

        function fireAlt() {
            if (!isPlaying) return;
            const w = weapons[currentWpnIdx];
            
            if (w.type === 'revolver') {
                playSfx('coin');
                const coinGeo = new THREE.SphereGeometry(0.35, 8, 8);
                const coinMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true });
                const mesh = new THREE.Mesh(coinGeo, coinMat);
                
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                mesh.position.copy(camera.position).add(dir.clone().multiplyScalar(1.2));
                scene.add(mesh);

                const vel = dir.multiplyScalar(10);
                vel.y += 4;
                coins.push({ mesh, vel });
                addStyle(50, "COIN TOSS");
            } else if (w.type === 'shotgun') {
                playSfx('shoot');
                const geo = new THREE.SphereGeometry(0.6, 8, 8); 
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
                const mesh = new THREE.Mesh(geo, mat);
                
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                
                mesh.position.copy(camera.position).add(dir.clone().multiplyScalar(1.5));
                scene.add(mesh);
                
                // Вектор с учетом угла камеры
                const vel = dir.multiplyScalar(18);
                cores.push({ mesh, vel });
                addStyle(40, "CORE EJECT");
            } else if (w.type === 'rocket') {
                // ALT-fire ракетницы: Заморозка / Разморозка ракет
                rocketsFrozen = !rocketsFrozen;
                playSfx('parry');
                rockets.forEach(r => r.frozen = rocketsFrozen);
                addStyle(60, rocketsFrozen ? "ROCKET FREEZE" : "ROCKET UNFREEZE");
            }
        }

        function checkHitscan(raycaster, damage, label) {
            // Рикошет от монетки с автоматическим наведением во врага
            const coinMeshes = coins.map(c => c.mesh);
            const coinHits = raycaster.intersectObjects(coinMeshes);

            if (coinHits.length > 0) {
                const coinMesh = coinHits[0].object;
                const coinIdx = coins.findIndex(c => c.mesh === coinMesh);
                if (coinIdx !== -1) {
                    const coinPos = coinMesh.position.clone();
                    scene.remove(coinMesh);
                    coins.splice(coinIdx, 1);
                    playSfx('parry');
                    addStyle(250, "ULTRA RICHOSHOT");

                    // Автонаведение в ближайшего врага от монеты
                    let closestEnemy = null;
                    let minDist = Infinity;
                    enemies.forEach(e => {
                        const d = e.mesh.position.distanceTo(coinPos);
                        if (d < minDist) { minDist = d; closestEnemy = e; }
                    });

                    if (closestEnemy) {
                        closestEnemy.takeDamage(damage * 2.5);
                        createExplosion(closestEnemy.mesh.position, 1.2, 0xffcc00);
                    }
                    return;
                }
            }

            const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
            if (hits.length > 0) {
                const enemy = getEnemyFromMesh(hits[0].object);
                if (enemy) enemy.takeDamage(damage);
            }
        }

        function triggerCoreNuke(pos) {
            playSfx('explosion');
            createExplosion(pos, 20, 0xff0055);
            addStyle(500, "CORE NUKE");
            flashScreen(0xff0055);

            enemies.forEach(e => {
                const dist = e.mesh.position.distanceTo(pos);
                if (dist < 20) {
                    e.takeDamage(400);
                }
            });
        }

        function doParry() {
            if (!isPlaying) return;
            playSfx('parry');
            let parried = false;

            projectiles.forEach(p => {
                if (p.mesh.position.distanceTo(player.pos) < 5) {
                    parried = true;
                    scene.remove(p.mesh);
                    projectiles = projectiles.filter(pr => pr !== p);
                    addStyle(250, "PROJECTILE PARRY");
                }
            });

            if (parried) {
                player.hp = Math.min(player.maxHp, player.hp + 35);
                updateHpUI();
                flashScreen(0xffcc00);
            }
        }

        function createExplosion(pos, radius, colorHex) {
            const geo = new THREE.SphereGeometry(radius, 10, 10);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex, wireframe: true });
            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.copy(pos);
            scene.add(sphere);

            setTimeout(() => scene.remove(sphere), 250);
        }

        function createParticles(pos, color, count) {
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.2, 0.2, 0.2),
                    new THREE.MeshBasicMaterial({ color })
                );
                p.position.copy(pos);
                p.vel = new THREE.Vector3((Math.random() - 0.5) * 8, Math.random() * 5, (Math.random() - 0.5) * 8);
                scene.add(p);
                particles.push(p);
            }
        }

        function flashScreen(colorHex) {
            const el = document.getElementById('flash-screen');
            el.style.background = '#' + colorHex.toString(16);
            el.style.opacity = '0.5';
            setTimeout(() => el.style.opacity = '0', 80);
        }

        function addStyle(pts, name) {
            score += pts * combo;
            combo = Math.min(5, combo + 0.1);
            document.getElementById('style-score').innerText = `${score} PTS`;
            
            const ranks = ["D", "C", "B", "A", "S", "SS", "SSS", "ULTRAKILL"];
            const rIdx = Math.min(ranks.length - 1, Math.floor(score / 800));
            document.getElementById('style-rank').innerText = ranks[rIdx];

            const feed = document.getElementById('style-feed');
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerText = `+${pts} ${name}`;
            feed.prepend(item);
            setTimeout(() => item.remove(), 1200);
        }

        function damagePlayer(amount) {
            player.hp -= amount;
            updateHpUI();
            flashScreen(0xff0055);
            if (player.hp <= 0) {
                alert("DESTROYED IN CYBER CITY! FINAL SCORE: " + score);
                location.reload();
            }
        }

        function updateHpUI() {
            document.getElementById('hp-val').innerText = Math.max(0, Math.ceil(player.hp));
            document.getElementById('hp-fill').style.width = `${(player.hp / player.maxHp) * 100}%`;
        }

        function getEnemyFromMesh(obj) {
            return enemies.find(e => e.mesh === obj || e.mesh.children.includes(obj));
        }

        function spawnWave() {
            enemies.push(new Enemy('filth', new THREE.Vector3(-6, 0, -12)));
            enemies.push(new Enemy('stray', new THREE.Vector3(8, 0, -16)));
            enemies.push(new Enemy('cerberus', new THREE.Vector3(0, 0, -20)));
        }

        function setupEvents() {
            const jZone = document.getElementById('joystick-zone');
            const jKnob = document.getElementById('joystick-knob');

            // Панель выбора оружия
            document.querySelectorAll('.wpn-btn').forEach(btn => {
                btn.addEventListener('touchstart', e => {
                    e.stopPropagation();
                    const idx = parseInt(btn.getAttribute('data-idx'));
                    selectWeapon(idx);
                });
                btn.addEventListener('click', e => {
                    const idx = parseInt(btn.getAttribute('data-idx'));
                    selectWeapon(idx);
                });
            });

            jZone.addEventListener('touchstart', e => { jZone.touchId = e.touches[0].identifier; }, {passive:true});
            
            window.addEventListener('touchmove', e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === jZone.touchId) {
                        const rect = jZone.getBoundingClientRect();
                        const dx = touch.clientX - (rect.left + rect.width / 2);
                        const dy = touch.clientY - (rect.top + rect.height / 2);
                        const dist = Math.min(35, Math.hypot(dx, dy));
                        const angle = Math.atan2(dy, dx);
                        moveVec.x = (Math.cos(angle) * dist) / 35;
                        moveVec.y = (Math.sin(angle) * dist) / 35;
                        jKnob.style.transform = `translate(${moveVec.x * 20}px, ${moveVec.y * 20}px)`;
                    } else if (touch.clientX > window.innerWidth / 2 && touchLook.id === touch.identifier) {
                        const dx = touch.clientX - touchLook.x;
                        const dy = touch.clientY - touchLook.y;
                        
                        if (!isNaN(dx) && !isNaN(dy)) {
                            player.yaw -= dx * 0.005;
                            player.pitch -= dy * 0.005;
                            player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch));
                        }
                        
                        touchLook.x = touch.clientX; 
                        touchLook.y = touch.clientY;
                    }
                }
            }, {passive:true});

            window.addEventListener('touchstart', e => {
                for (let touch of e.changedTouches) {
                    if (touch.clientX > window.innerWidth / 2 && touchLook.id === null) {
                        const btns = document.getElementById('buttons-zone').getBoundingClientRect();
                        const wpnPanel = document.getElementById('weapon-selector').getBoundingClientRect();
                        if ((touch.clientX < btns.left || touch.clientY < btns.top) && touch.clientX < wpnPanel.left) {
                            touchLook.id = touch.identifier;
                            touchLook.x = touch.clientX; 
                            touchLook.y = touch.clientY;
                        }
                    }
                }
            }, {passive:true});

            const resetTouch = e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === jZone.touchId) { jZone.touchId = null; moveVec = {x:0, y:0}; jKnob.style.transform = `translate(0,0)`; }
                    if (touch.identifier === touchLook.id) touchLook.id = null;
                }
            };
            window.addEventListener('touchend', resetTouch);

            document.getElementById('btn-fire').addEventListener('touchstart', e => { e.stopPropagation(); firePrimary(); });
            document.getElementById('btn-alt').addEventListener('touchstart', e => { e.stopPropagation(); fireAlt(); });
            document.getElementById('btn-parry').addEventListener('touchstart', e => { e.stopPropagation(); doParry(); });
            document.getElementById('btn-jump').addEventListener('touchstart', e => { 
                e.stopPropagation(); 
                if (player.ridingRocket) {
                    player.ridingRocket = null;
                    player.vel.y = 12;
                } else if (player.isGrounded) {
                    player.vel.y = 11; 
                }
            });
            document.getElementById('btn-dash').addEventListener('touchstart', e => {
                e.stopPropagation();
                const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                player.pos.addScaledVector(dir, 6);
            });
        }

        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (isPlaying && !isPaused) {
                if (isNaN(player.pitch)) player.pitch = 0;
                if (isNaN(player.yaw)) player.yaw = 0;

                const euler = new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);

                // Если игрок едет на ракете
                if (player.ridingRocket) {
                    const r = player.ridingRocket;
                    if (!r.frozen) {
                        r.mesh.position.addScaledVector(r.dir, dt);
                    }
                    player.pos.copy(r.mesh.position).add(new THREE.Vector3(0, 1.2, 0));
                    player.vel.set(0, 0, 0);
                } else {
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
                    const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); side.y = 0; side.normalize();

                    player.pos.addScaledVector(forward, -moveVec.y * 14 * dt);
                    player.pos.addScaledVector(side, moveVec.x * 14 * dt);

                    player.vel.y -= 28 * dt;
                    player.pos.addScaledVector(player.vel, dt);

                    if (player.pos.y <= 2) { player.pos.y = 2; player.vel.y = 0; player.isGrounded = true; }
                }

                camera.position.copy(player.pos);

                enemies.forEach(e => e.update(dt));
                projectiles.forEach(p => p.mesh.position.addScaledVector(p.dir, dt));
                
                // Физика монет
                coins.forEach(c => { c.vel.y -= 14 * dt; c.mesh.position.addScaledVector(c.vel, dt); });
                
                // Физика ядра Shotgun
                cores.forEach(c => {
                    c.vel.y -= 12 * dt;
                    c.mesh.position.addScaledVector(c.vel, dt);
                });

                // Физика ракет и Rocket Riding
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const r = rockets[i];
                    if (!r.frozen) {
                        r.mesh.position.addScaledVector(r.dir, dt);
                    }

                    // Проверка подсадки на ракету (Rocket Riding)
                    if (!player.ridingRocket && player.pos.distanceTo(r.mesh.position) < 2.0) {
                        player.ridingRocket = r;
                        addStyle(150, "ROCKET RIDE");
                    }

                    // Попадание ракеты во врага
                    enemies.forEach(e => {
                        if (e.mesh.position.distanceTo(r.mesh.position) < 2.5) {
                            createExplosion(r.mesh.position, 6, 0xff0055);
                            e.takeDamage(120);
                            if (player.ridingRocket === r) player.ridingRocket = null;
                            scene.remove(r.mesh);
                            rockets.splice(i, 1);
                        }
                    });
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.position.addScaledVector(p.vel, dt);
                    p.scale.multiplyScalar(0.92);
                    if (p.scale.x < 0.02) { scene.remove(p); particles.splice(i, 1); }
                }

                if (enemies.length === 0) spawnWave();
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            initEngine();
            isPlaying = true;
            animate();
        });
    </script>
</body>
</html>
